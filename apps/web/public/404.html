<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | BoardEject</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        background: #f6f5f0;
        color: #24352d;
        font:
          18px/1.6 system-ui,
          sans-serif;
        display: grid;
        min-height: 100svh;
        place-items: center;
      }
      main {
        max-width: 540px;
        padding: 32px;
      }
      h1 {
        font-size: 48px;
        line-height: 1.1;
        letter-spacing: -2px;
      }
      a {
        color: #264b36;
        text-underline-offset: 5px;
      }
      a:focus-visible {
        outline: 3px solid #638450;
        outline-offset: 5px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        text-decoration: none;
      }
      .brand img {
        width: 30px;
        height: 30px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"
        ><img src="/favicon.svg" width="30" height="30" alt="" /> BoardEject</a
      >
      <p>404</p>
      <h1>This page isn’t on the board.</h1>
      <p>The address may be incorrect or the page may have moved.</p>
      <a href="/">Back to BoardEject →</a>
    </main>
  </body>
</html>
