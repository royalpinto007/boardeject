name: Freeform UI capture experiment
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Native capture scenario
        type: choice
        options:
          [
            tables,
            images-text,
            tables-issue-15,
            tables-issue-15-geometry,
            tables-issue-15-controls,
            tables-issue-15-structure,
            tables-issue-15-style-controls,
            tables-issue-15-advanced,
            tables-issue-15-rotation,
            tables-issue-15-palettes,
            tables-issue-15-colors,
            tables-issue-15-remaining,
            tables-issue-15-borders,
            tables-issue-15-embedded,
            tables-issue-15-multiple,
            tables-issue-15-border-details,
            tables-issue-15-embedded-copy,
            tables-issue-15-border-color,
            tables-issue-15-embedded-direct,
            tables-issue-15-embedded-cells,
            ink-issue-13,
            archive-storage,
          ]
        default: tables
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install archive dependencies
        if: inputs.scenario == 'archive-storage'
        run: |
          npm ci --ignore-scripts
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install ffmpeg
          brew install ffmpeg
      - name: Probe actual Freeform session
        env:
          CAPTURE_OUTPUT: ${{ runner.temp }}/freeform-capture-experiment
          TABLE_GEOMETRY_ONLY: "1"
          CAPTURE_SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "$CAPTURE_SCENARIO" = "ink-issue-13" ]; then
            TABLE_GEOMETRY_ONLY=0 python3 tools/freeform-experiment/differential.py
          elif [ "$CAPTURE_SCENARIO" = "archive-storage" ]; then
            python3 tools/freeform-experiment/archive_storage.py
          elif [ "$CAPTURE_SCENARIO" = "images-text" ]; then
            python3 tools/freeform-experiment/images_text.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15" ]; then
            python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-geometry" ]; then
            TABLE_ISSUE15_PHASE=geometry python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-controls" ]; then
            TABLE_ISSUE15_PHASE=controls python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-structure" ]; then
            TABLE_ISSUE15_PHASE=structure python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-style-controls" ]; then
            TABLE_ISSUE15_PHASE=style-controls python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-advanced" ]; then
            TABLE_ISSUE15_PHASE=advanced python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-rotation" ]; then
            TABLE_ISSUE15_PHASE=rotation python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-palettes" ]; then
            TABLE_ISSUE15_PHASE=palettes python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-colors" ]; then
            TABLE_ISSUE15_PHASE=colors python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-remaining" ]; then
            TABLE_ISSUE15_PHASE=remaining python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-borders" ]; then
            TABLE_ISSUE15_PHASE=borders python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-embedded" ]; then
            TABLE_ISSUE15_PHASE=embedded python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-multiple" ]; then
            TABLE_ISSUE15_PHASE=multiple python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-border-details" ]; then
            TABLE_ISSUE15_PHASE=border-details python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-embedded-copy" ]; then
            TABLE_ISSUE15_PHASE=embedded-copy python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-border-color" ]; then
            TABLE_ISSUE15_PHASE=border-color python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-embedded-direct" ]; then
            TABLE_ISSUE15_PHASE=embedded-direct python3 tools/freeform-experiment/tables_issue15.py
          elif [ "$CAPTURE_SCENARIO" = "tables-issue-15-embedded-cells" ]; then
            TABLE_ISSUE15_PHASE=embedded-cells python3 tools/freeform-experiment/tables_issue15.py
          else
            python3 tools/freeform-experiment/differential.py
          fi
      - name: Upload experimental evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeform-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/freeform-capture-experiment/
          retention-days: 7
          if-no-files-found: error
