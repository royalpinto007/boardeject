name: Freeform UI capture experiment
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Native capture scenario
        type: choice
        options: [tables, images-text]
        default: tables
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe actual Freeform session
        env:
          CAPTURE_OUTPUT: ${{ runner.temp }}/freeform-capture-experiment
          TABLE_GEOMETRY_ONLY: "1"
          CAPTURE_SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "$CAPTURE_SCENARIO" = "images-text" ]; then
            python3 tools/freeform-experiment/images_text.py
          else
            python3 tools/freeform-experiment/differential.py
          fi
      - name: Upload experimental evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeform-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/freeform-capture-experiment/
          retention-days: 7
          if-no-files-found: error
