name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chrome
      - name: Browser import and capture checks
        run: |
          npm run preview > "$RUNNER_TEMP/boardeject-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/browser_check.py
          python3 scripts/capture_browser_check.py
      - run: npm audit --audit-level=moderate
  helper-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swiftc apps/mac-helper/main.swift -o /tmp/boardeject-helper
      - name: Verify helper command-line onboarding
        run: |
          set +e
          output=$(/tmp/boardeject-helper 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "Usage:" <<< "$output"
