name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  helper-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swiftc apps/mac-helper/main.swift -o /tmp/boardeject-helper
