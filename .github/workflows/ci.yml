name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chrome
      - name: Browser import and capture checks
        run: |
          npm run preview > "$RUNNER_TEMP/boardeject-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/browser_check.py
          python3 scripts/capture_browser_check.py
          node --experimental-strip-types scripts/explorer-fixtures.ts
          python3 scripts/explorer_browser_check.py
      - run: npm audit --audit-level=moderate
  helper-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swiftc apps/mac-helper/main.swift -o /tmp/boardeject-helper
      - run: swiftc apps/archive-helper/main.swift -lsqlite3 -o /tmp/boardeject-archive-helper
      - name: Verify helper command-line onboarding
        run: |
          set +e
          output=$(/tmp/boardeject-helper 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "Usage:" <<< "$output"
      - name: Verify archive helper uses a stable copy and leaves sources unchanged
        run: |
          source_dir=$(mktemp -d)
          snapshot_dir="$RUNNER_TEMP/archive-helper-snapshot"
          printf 'database fixture' > "$source_dir/boards.db"
          printf 'wal fixture' > "$source_dir/boards.db-wal"
          printf 'shm fixture' > "$source_dir/boards.db-shm"
          before=$(shasum -a 256 "$source_dir"/*)
          /tmp/boardeject-archive-helper snapshot "$source_dir/boards.db" "$snapshot_dir"
          after=$(shasum -a 256 "$source_dir"/*)
          test "$before" = "$after"
          cmp "$source_dir/boards.db" "$snapshot_dir/boards.db"
          cmp "$source_dir/boards.db-wal" "$snapshot_dir/boards.db-wal"
          cmp "$source_dir/boards.db-shm" "$snapshot_dir/boards.db-shm"
          grep -F '"format" : "boardeject.native-snapshot"' "$snapshot_dir/snapshot.json"
          test "$(find "$snapshot_dir" -type f | wc -l | tr -d ' ')" -eq 4
      - name: Reject an unverified copied schema
        run: |
          source_dir=$(mktemp -d)
          snapshot_dir="$RUNNER_TEMP/archive-helper-unknown-schema"
          sqlite3 "$source_dir/boards.db" 'PRAGMA user_version=99; CREATE TABLE unknown(value TEXT);'
          /tmp/boardeject-archive-helper snapshot "$source_dir/boards.db" "$snapshot_dir"
          set +e
          output=$(/tmp/boardeject-archive-helper catalog "$snapshot_dir" 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          grep -F "Unsupported Freeform database version. No files were modified." <<< "$output"
